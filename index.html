<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRONE</title>
    <meta name="description" content="A wheel within a wheel." />
    <meta name="theme-color" content="#050308" />
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%23050308" stroke="%23c9a227" stroke-width="1.5"/><ellipse cx="16" cy="16" rx="10" ry="6" fill="%23f4f1e8"/><circle cx="16" cy="16" r="4" fill="%23c9a227"/><circle cx="16" cy="16" r="2" fill="%23050308"/></svg>' />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/throne.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <!--
      the wheels keep a ledger.
      listen. count. burn. leave.
      the mouth opens if you stay.
    -->
    <aside id="hud" class="hud-safe" aria-label="Safety controls">
      <button id="calm-toggle" type="button" aria-pressed="false" title="Stop strobing, freeze motion, quiet the sound">
        Calm Mode
      </button>
      <div class="volume-cluster">
        <button id="mute-toggle" type="button" aria-pressed="false" title="Mute all sound">
          Mute
        </button>
        <label class="volume-label" for="volume">
          <span class="sr-only">Volume</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.62" />
        </label>
      </div>
      <p id="days-counter" class="days-counter" title="it declines to close">
        <strong id="days-value">0</strong>
      </p>
    </aside>

    <div id="veil" class="veil" role="dialog" aria-labelledby="veil-title">
      <div class="veil-inner">
        <h1 id="veil-title" class="veil-title">THRONE</h1>
        <button id="enter" type="button" class="veil-enter">look upon it</button>
        <p class="veil-warn">Calm Mode and mute stay in the corner. Brief light lives here.</p>
      </div>
    </div>

    <div id="wheel-root" class="wheel-root" aria-hidden="true"></div>

    <canvas id="cursor-trail" class="overlay-canvas" aria-hidden="true"></canvas>
    <svg id="sacred-geo" class="sacred-geo" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div id="scanlines" class="scanlines" aria-hidden="true"></div>
    <div id="vignette" class="vignette" aria-hidden="true"></div>
    <div id="chromatic" class="chromatic" aria-hidden="true"></div>
    <div id="pulse" class="pulse" aria-hidden="true"></div>
    <div id="strobe" class="strobe" aria-hidden="true"></div>
    <div id="grain" class="grain" aria-hidden="true"></div>
    <div id="inside" class="inside" aria-hidden="true"></div>
    <div id="ripples" class="ripples" aria-hidden="true"></div>

    <div id="caption" class="caption" role="status" aria-live="polite"></div>

    <div id="firmament" class="firmament">
      <div id="orbit" class="orbit" title=""></div>
      <div class="orbit-ghost orbit-ghost-a" aria-hidden="true"></div>
      <div class="orbit-ghost orbit-ghost-b" aria-hidden="true"></div>
      <button id="mouth" class="mouth" type="button" aria-label="the mouth"></button>
      <div id="charge" class="charge" aria-hidden="true"></div>

      <button type="button" class="relic seal" data-seal="rim" data-drift aria-label="rim" style="left:12%;top:22%">◈</button>
      <button type="button" class="relic seal" data-seal="gate" data-drift aria-label="gate" style="left:82%;top:18%">◎</button>
      <button type="button" class="relic seal" data-seal="voice" data-drift aria-label="voice" style="left:14%;top:72%">◉</button>
      <button type="button" class="relic seal" data-seal="fire" data-drift aria-label="fire" style="left:84%;top:70%">✸</button>

      <button id="choir-toggle" class="relic vesica" type="button" aria-pressed="false" aria-label="choir" style="left:6%;top:46%"></button>
      <button id="strike" class="relic shard-hit" type="button" aria-label="strike" style="left:90%;top:44%">✧</button>

      <button id="fear-not" class="fear-not relic" type="button" style="left:48%;top:86%">Fear Not</button>

      <p class="shard" data-glitch data-drift style="left:8%;top:12%">full of eyes</p>
      <p class="shard flee" data-flee data-glitch style="left:70%;top:10%">do not reach</p>
      <p class="shard" data-glitch data-drift style="left:6%;top:88%">it declines to close</p>
      <p class="shard" data-glitch data-drift style="left:72%;top:88%">the wheels moved</p>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
